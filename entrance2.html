<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Aim - Entrance XR</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            z-index: 10;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>
    <div id="info">Deep Aim - Entrance XR (Prototype)<br>Drag to look around</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script type="module">
        import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/webxr/VRButton.js';

        const scene = new THREE.Scene();
        // 抜けるような快晴の青空
        scene.background = new THREE.Color(0x4488ff);
        // 空気感を追加 (空の色に馴染ませる)
        scene.fog = new THREE.Fog(0x4488ff, 15, 60);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        // 環境光: 青みを抑え、コンクリートに馴染む自然なグレー/微細なブルーに調整
        const hemiLight = new THREE.HemisphereLight(0xb0c4de, 0x444444, 0.4);
        scene.add(hemiLight);

        // 太陽光: 右手前(X:25, Z:10)の少し低い位置(Y:12)から、空間の左奥に向かって光を差し込ませる
        const dirLight = new THREE.DirectionalLight(0xffffee, 2.5);
        dirLight.position.set(25, 12, 10);
        dirLight.castShadow = true;
        // シャドウカメラの範囲を空間全体を覆うように拡大
        dirLight.shadow.camera.top = 25;
        dirLight.shadow.camera.bottom = -25;
        dirLight.shadow.camera.left = -25;
        dirLight.shadow.camera.right = 25;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 100;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        const anchors = {
            PLAYER_START: new THREE.Group(),
            HALL_ORIGIN: new THREE.Group(),
            DESK_ORIGIN: new THREE.Group(),
            BUTTON_ORIGIN: new THREE.Group(),
            TARGET_AREA_ORIGIN: new THREE.Group()
        };
        scene.add(anchors.HALL_ORIGIN);
        
        // プレイヤー空間の基準点（VR移動のベースとなるようY=0に設定）
        anchors.PLAYER_START.position.set(0, 0, 4); // 机の少し手前(Z=4)
        scene.add(anchors.PLAYER_START);
        
        // カメラをプレイヤー開始位置の子にする(VR時の基準点)
        // PC用の初期視点として高さを設定（VR時はHMDの物理高さで自動上書きされる）
        camera.position.set(0, 1.65, 0);
        anchors.PLAYER_START.add(camera);

        const matConcrete = new THREE.MeshStandardMaterial({ 
            color: 0x888888, 
            roughness: 0.9, 
            metalness: 0.1 
        });
        const matGround = new THREE.MeshStandardMaterial({
            color: 0xc2a67a, // 乾いた黄土色
            roughness: 1.0,
            metalness: 0.0
        });
        const matDarkMetal = new THREE.MeshStandardMaterial({ 
            color: 0x333333, 
            roughness: 0.6, 
            metalness: 0.7 
        });
        const matButton = new THREE.MeshStandardMaterial({ 
            color: 0xaa2222, 
            roughness: 0.4, 
            metalness: 0.2 
        });

        const visualGroups = {
            hall: new THREE.Group(),
            desk: new THREE.Group(),
            button: new THREE.Group()
        };
        anchors.HALL_ORIGIN.add(visualGroups.hall);

        // 外に広がる無限の黄土色の大地
        const groundOutside = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), matGround);
        groundOutside.rotation.x = -Math.PI / 2;
        groundOutside.position.y = -0.1; // 床よりわずかに下
        groundOutside.receiveShadow = true;
        scene.add(groundOutside);

        // ホール内側の床
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(16, 20), matConcrete);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        visualGroups.hall.add(floor);

        // 天井 (開口部を残すために巨大な梁を渡す構造)
        for(let i=0; i<4; i++) {
            const beam = new THREE.Mesh(new THREE.BoxGeometry(18, 0.5, 2), matConcrete);
            beam.position.set(0, 7, -7 + i * 4.5);
            beam.castShadow = true; beam.receiveShadow = true;
            visualGroups.hall.add(beam);
        }

        // 左の壁 (ソリッド)
        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(1, 7, 20), matConcrete);
        leftWall.position.set(-8.5, 3.5, 0);
        leftWall.castShadow = true; leftWall.receiveShadow = true;
        visualGroups.hall.add(leftWall);

        // 右の壁 (千鳥状の窓枠を構成するために分割)
        // 1. 奥の壁部分 (Z: -10 ~ -1.6 -> 幅8.4, 中心Z -5.8)
        const rightWallBack = new THREE.Mesh(new THREE.BoxGeometry(1, 7, 8.4), matConcrete);
        rightWallBack.position.set(8.5, 3.5, -5.8);
        rightWallBack.castShadow = true; rightWallBack.receiveShadow = true;
        visualGroups.hall.add(rightWallBack);

        // 2. 手前の壁部分 (Z: 1.6 ~ 10 -> 幅8.4, 中心Z 5.8)
        const rightWallFront = new THREE.Mesh(new THREE.BoxGeometry(1, 7, 8.4), matConcrete);
        rightWallFront.position.set(8.5, 3.5, 5.8);
        rightWallFront.castShadow = true; rightWallFront.receiveShadow = true;
        visualGroups.hall.add(rightWallFront);

        // 3. 窓の下の壁 (Y: 0 ~ 2.0 -> 高さ2.0, 中心Y 1.0)
        const rightWallBottom = new THREE.Mesh(new THREE.BoxGeometry(1, 2.0, 3.2), matConcrete);
        rightWallBottom.position.set(8.5, 1.0, 0);
        rightWallBottom.castShadow = true; rightWallBottom.receiveShadow = true;
        visualGroups.hall.add(rightWallBottom);

        // 4. 窓の上の壁 (Y: 4.4 ~ 7.0 -> 高さ2.6, 中心Y 5.7)
        const rightWallTop = new THREE.Mesh(new THREE.BoxGeometry(1, 2.6, 3.2), matConcrete);
        rightWallTop.position.set(8.5, 5.7, 0);
        rightWallTop.castShadow = true; rightWallTop.receiveShadow = true;
        visualGroups.hall.add(rightWallTop);

        // 5. 窓の中のブロック配置 (千鳥状 3x4 / 穴6個)
        for (let r = 0; r < 3; r++) {
            for (let c = 0; c < 4; c++) {
                // (行+列)が偶数の場所はコンクリートブロックで埋める (奇数が穴になる)
                if ((r + c) % 2 === 0) {
                    const block = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.8, 0.8), matConcrete);
                    block.position.set(8.5, 2.4 + r * 0.8, -1.2 + c * 0.8);
                    block.castShadow = true;
                    block.receiveShadow = true;
                    visualGroups.hall.add(block);
                }
            }
        }

        // 奥の壁（正面の巨大な開口部）
        // 左側の壁
        const backWallLeft = new THREE.Mesh(new THREE.BoxGeometry(4, 7, 1), matConcrete);
        backWallLeft.position.set(-6, 3.5, -10.5);
        backWallLeft.castShadow = true; backWallLeft.receiveShadow = true;
        visualGroups.hall.add(backWallLeft);
        
        // 右側の壁
        const backWallRight = new THREE.Mesh(new THREE.BoxGeometry(4, 7, 1), matConcrete);
        backWallRight.position.set(6, 3.5, -10.5);
        backWallRight.castShadow = true; backWallRight.receiveShadow = true;
        visualGroups.hall.add(backWallRight);
        
        // 上部（鴨居部分、Y=5〜7） これにより 8m x 5m の巨大な開口部ができる
        const backWallTop = new THREE.Mesh(new THREE.BoxGeometry(8, 2, 1), matConcrete);
        backWallTop.position.set(0, 6, -10.5);
        backWallTop.castShadow = true; backWallTop.receiveShadow = true;
        visualGroups.hall.add(backWallTop);

        // 手前の壁 (プレイヤーの背後)
        const frontWall = new THREE.Mesh(new THREE.BoxGeometry(16, 7, 1), matConcrete);
        frontWall.position.set(0, 3.5, 10.5);
        frontWall.castShadow = true; frontWall.receiveShadow = true;
        visualGroups.hall.add(frontWall);

        // 柱の反復配置 (奥行き方向に均等配置、ただし右壁のZ=0窓前は抜く)
        for (let i = 0; i < 5; i++) {
            const zPos = -8 + i * 4;
            
            // 左側の柱
            const pLeft = new THREE.Mesh(new THREE.BoxGeometry(0.8, 7, 1.2), matConcrete);
            pLeft.position.set(-7.5, 3.5, zPos);
            pLeft.castShadow = true; pLeft.receiveShadow = true;
            visualGroups.hall.add(pLeft);

            // 右側の柱 (窓の中央 Z=0 と被る場合は生成しない)
            if (zPos !== 0) {
                const pRight = new THREE.Mesh(new THREE.BoxGeometry(0.8, 7, 1.2), matConcrete);
                pRight.position.set(7.5, 3.5, zPos);
                pRight.castShadow = true; pRight.receiveShadow = true;
                visualGroups.hall.add(pRight);
            }
        }

        // 机 (人間スケールの具体物)
        anchors.DESK_ORIGIN.position.set(0, 0, 2);
        scene.add(anchors.DESK_ORIGIN);
        
        const deskTop = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.1, 0.8), matDarkMetal);
        deskTop.position.set(0, 0.85, 0);
        deskTop.castShadow = true; deskTop.receiveShadow = true;
        visualGroups.desk.add(deskTop);

        const deskLeg1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8, 0.6), matDarkMetal);
        deskLeg1.position.set(-0.7, 0.4, 0);
        deskLeg1.castShadow = true; deskLeg1.receiveShadow = true;
        visualGroups.desk.add(deskLeg1);

        const deskLeg2 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8, 0.6), matDarkMetal);
        deskLeg2.position.set(0.7, 0.4, 0);
        deskLeg2.castShadow = true; deskLeg2.receiveShadow = true;
        visualGroups.desk.add(deskLeg2);

        anchors.DESK_ORIGIN.add(visualGroups.desk);

        // ボタン (訓練開始用)
        anchors.BUTTON_ORIGIN.position.set(0, 0.9, 2); // 机の上
        scene.add(anchors.BUTTON_ORIGIN);

        const buttonBase = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.18, 0.05, 16), matDarkMetal);
        buttonBase.position.set(0, 0.025, 0);
        buttonBase.castShadow = true; buttonBase.receiveShadow = true;
        visualGroups.button.add(buttonBase);

        const buttonPush = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.04, 16), matButton);
        buttonPush.position.set(0, 0.06, 0);
        buttonPush.castShadow = true; buttonPush.receiveShadow = true;
        visualGroups.button.add(buttonPush);

        anchors.BUTTON_ORIGIN.add(visualGroups.button);

        // 標的エリアのアンカー設定 (机より奥、Z=-2〜-8付近を想定)
        anchors.TARGET_AREA_ORIGIN.position.set(0, 0, -5);
        scene.add(anchors.TARGET_AREA_ORIGIN);

        // PCブラウザ確認用のマウスクリック＆ドラッグによる見回し機能
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        // カメラの回転角度を保持
        let cameraRotation = { x: 0, y: 0 };

        document.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.offsetX, y: e.offsetY };
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaMove = {
                    x: e.offsetX - previousMousePosition.x,
                    y: e.offsetY - previousMousePosition.y
                };

                // マウス移動量に応じて回転角度を更新
                cameraRotation.y -= deltaMove.x * 0.005; // 左右
                cameraRotation.x -= deltaMove.y * 0.005; // 上下

                // 上下の回転を制限（真上・真下を向きすぎないように）
                cameraRotation.x = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, cameraRotation.x));

                // カメラのクォータニオンを更新
                const quaternionX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), cameraRotation.x);
                const quaternionY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), cameraRotation.y);
                
                // Y軸回転を先に適用し、その後にX軸回転を適用
                camera.quaternion.copy(quaternionY).multiply(quaternionX);

                previousMousePosition = { x: e.offsetX, y: e.offsetY };
            }
        });

        document.addEventListener('mouseup', () => { isDragging = false; });
        document.addEventListener('mouseleave', () => { isDragging = false; });

        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        const clock = new THREE.Clock();

        renderer.setAnimationLoop(function () {
            const dt = clock.getDelta();

            // WebXRのコントローラスティック移動（ロコモーション）処理
            if (renderer.xr.isPresenting) {
                const session = renderer.xr.getSession();
                if (session && session.inputSources) {
                    for (const source of session.inputSources) {
                        // gamepadプロパティを持つコントローラのみ処理
                        if (source.gamepad && source.gamepad.axes.length >= 4) {
                            // Quest等の標準: axes[2]がスティックのX軸, axes[3]がY軸
                            const xAxis = source.gamepad.axes[2];
                            const yAxis = source.gamepad.axes[3];

                            // デッドゾーンの設定（スティックのわずかな傾きや遊びを無視）
                            if (Math.abs(xAxis) > 0.1 || Math.abs(yAxis) > 0.1) {
                                const speed = 3.0 * dt; // 移動速度 (秒速3メートル)

                                // ヘッドセット(カメラ)が向いている水平方向を計算
                                const cameraDir = new THREE.Vector3();
                                camera.getWorldDirection(cameraDir);
                                cameraDir.y = 0; // 上下方向の浮遊を無効化（常に床を這う）
                                cameraDir.normalize();

                                // ヘッドセットの右方向ベクトルを計算
                                const cameraRight = new THREE.Vector3();
                                cameraRight.crossVectors(cameraDir, new THREE.Vector3(0, 1, 0)).normalize();

                                // スティックの入力値から移動ベクトルを合成
                                // ※Y軸は前に倒すと負(-1)になる仕様のため、反転させる
                                const moveVec = new THREE.Vector3();
                                moveVec.addScaledVector(cameraDir, -yAxis * speed);
                                moveVec.addScaledVector(cameraRight, xAxis * speed);

                                // プレイヤーの空間全体（Rig）を移動
                                anchors.PLAYER_START.position.add(moveVec);
                            }
                        }
                    }
                }
            }

            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
