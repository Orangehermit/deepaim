<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Aim - Entrance XR</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            z-index: 10;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>
    <div id="info">Deep Aim - Entrance XR (Prototype)<br>Drag to look around</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script type="module">
        import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/webxr/VRButton.js';

        const scene = new THREE.Scene();
        // 抜けるような快晴の青空
        scene.background = new THREE.Color(0x4488ff);
        // 空気感を追加 (空の色に馴染ませる)
        scene.fog = new THREE.Fog(0x4488ff, 15, 60);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        // 環境光: 青みを抑え、コンクリートに馴染む自然なグレー/微細なブルーに調整
        const hemiLight = new THREE.HemisphereLight(0xb0c4de, 0x444444, 0.4);
        scene.add(hemiLight);

        // 太陽光: 右手前(X:25, Z:10)の少し低い位置(Y:12)から、空間の左奥に向かって光を差し込ませる
        const dirLight = new THREE.DirectionalLight(0xffffee, 2.5);
        dirLight.position.set(25, 12, 10);
        dirLight.castShadow = true;
        // シャドウカメラの範囲を空間全体を覆うように拡大
        dirLight.shadow.camera.top = 25;
        dirLight.shadow.camera.bottom = -25;
        dirLight.shadow.camera.left = -25;
        dirLight.shadow.camera.right = 25;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 100;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        // ---------------------------------------------------------
        // 空間設定 (ここで広さや配置を一括調整できます)
        // ---------------------------------------------------------
        const CONFIG = {
            room: {
                width: 18,   // 空間の幅 (X軸)
                depth: 24,   // 空間の奥行き (Z軸)
                height: 8    // 天井の高さ (Y軸)
            },
            positions: {
                playerStartZ: 9, // プレイヤーの初期Z座標 (大きいほど手前側)
                deskZ: 7         // 机のZ座標 (プレイヤーの少し前)
            },
            backOpening: {
                width: 8,    // 正面奥の開口部の幅
                height: 5    // 正面奥の開口部の高さ
            },
            targetSequence: {
                count: 10,
                initialDelay: 1.0,
                visibleDurationMin: 1.5,
                visibleDurationMax: 2.5,
                gapDurationMin: 1.0,
                gapDurationMax: 3.0,
                sideMargin: 2.0,
                backMargin: 2.0,
                frontMarginFromDesk: 3.0,
                minY: 1.2,
                ceilingMargin: 1.2,
                minDistanceFromPrevious: 2.0,
                maxPositionAttempts: 20,
                audioFile: 'target_spawn.wav',
                audioRefDistance: 2.0,
                audioMaxDistance: 30.0,
                audioRolloffFactor: 1.0
            },
            interaction: {
                controllerContactRadius: 0.055,
                controllerContactOffsetZ: -0.08,
                buttonTouchRadius: 0.13,
                buttonTouchHeight: 0.025,
                buttonDepression: 0.025,
                buttonAnimationSpeed: 18
            },
            debug: {
                showTargetSpawnBounds: false
            }
        };

        const anchors = {
            PLAYER_START: new THREE.Group(),
            HALL_ORIGIN: new THREE.Group(),
            DESK_ORIGIN: new THREE.Group(),
            BUTTON_ORIGIN: new THREE.Group(),
            TARGET_AREA_ORIGIN: new THREE.Group()
        };
        scene.add(anchors.HALL_ORIGIN);
        
        // プレイヤー空間の基準点（VR移動のベースとなるようY=0に設定）
        anchors.PLAYER_START.position.set(0, 0, CONFIG.positions.playerStartZ);
        scene.add(anchors.PLAYER_START);
        
        // PC用の初期視点として高さを設定（VR時はHMDの物理高さで上書きされる）
        camera.position.set(0, 1.65, 0);
        anchors.PLAYER_START.add(camera);

        const matConcrete = new THREE.MeshStandardMaterial({ 
            color: 0x888888, roughness: 0.9, metalness: 0.1 
        });
        const matGround = new THREE.MeshStandardMaterial({
            color: 0xc2a67a, roughness: 1.0, metalness: 0.0
        });
        const matDarkMetal = new THREE.MeshStandardMaterial({ 
            color: 0x333333, roughness: 0.6, metalness: 0.7 
        });
        const matButton = new THREE.MeshStandardMaterial({ 
            color: 0xaa2222, roughness: 0.4, metalness: 0.2 
        });

        const visualGroups = {
            hall: new THREE.Group(),
            desk: new THREE.Group(),
            button: new THREE.Group()
        };
        anchors.HALL_ORIGIN.add(visualGroups.hall);

        // 外に広がる無限の黄土色の大地
        const groundOutside = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), matGround);
        groundOutside.rotation.x = -Math.PI / 2;
        groundOutside.position.y = -0.1; // 床よりわずかに下
        groundOutside.receiveShadow = true;
        scene.add(groundOutside);

        // 計算用の補助変数
        const halfW = CONFIG.room.width / 2;
        const halfD = CONFIG.room.depth / 2;
        const h = CONFIG.room.height;

        // ホール内側の床
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(CONFIG.room.width, CONFIG.room.depth), matConcrete);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        visualGroups.hall.add(floor);

        // 天井 (開口部を残すために巨大な梁を渡す構造)
        const beamCount = Math.floor(CONFIG.room.depth / 4); // 奥行きに応じて本数を自動調整
        for(let i=0; i<beamCount; i++) {
            const beam = new THREE.Mesh(new THREE.BoxGeometry(CONFIG.room.width + 2, 0.5, 2), matConcrete);
            const zPos = -halfD + 1 + i * ((CONFIG.room.depth - 2) / (beamCount - 1 || 1));
            beam.position.set(0, h, zPos);
            beam.castShadow = true; beam.receiveShadow = true;
            visualGroups.hall.add(beam);
        }

        // 左の壁 (ソリッド)
        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(1, h, CONFIG.room.depth), matConcrete);
        leftWall.position.set(-halfW - 0.5, h / 2, 0);
        leftWall.castShadow = true; leftWall.receiveShadow = true;
        visualGroups.hall.add(leftWall);

        // 右の壁 (千鳥状の窓枠を構成するために分割)
        const windowWidth = 3.2;
        const wallD = (CONFIG.room.depth - windowWidth) / 2;
        
        const rightWallBack = new THREE.Mesh(new THREE.BoxGeometry(1, h, wallD), matConcrete);
        rightWallBack.position.set(halfW + 0.5, h / 2, -halfD + wallD / 2);
        rightWallBack.castShadow = true; rightWallBack.receiveShadow = true;
        visualGroups.hall.add(rightWallBack);

        const rightWallFront = new THREE.Mesh(new THREE.BoxGeometry(1, h, wallD), matConcrete);
        rightWallFront.position.set(halfW + 0.5, h / 2, halfD - wallD / 2);
        rightWallFront.castShadow = true; rightWallFront.receiveShadow = true;
        visualGroups.hall.add(rightWallFront);

        // 窓の下の壁
        const rightWallBottom = new THREE.Mesh(new THREE.BoxGeometry(1, 2.0, windowWidth), matConcrete);
        rightWallBottom.position.set(halfW + 0.5, 1.0, 0);
        rightWallBottom.castShadow = true; rightWallBottom.receiveShadow = true;
        visualGroups.hall.add(rightWallBottom);

        // 窓の上の壁
        const topWallHeight = h - 4.4;
        const rightWallTop = new THREE.Mesh(new THREE.BoxGeometry(1, topWallHeight, windowWidth), matConcrete);
        rightWallTop.position.set(halfW + 0.5, 4.4 + topWallHeight / 2, 0);
        rightWallTop.castShadow = true; rightWallTop.receiveShadow = true;
        visualGroups.hall.add(rightWallTop);

        // 窓の中のブロック配置 (千鳥状 3x4 / 穴6個)
        for (let r = 0; r < 3; r++) {
            for (let c = 0; c < 4; c++) {
                if ((r + c) % 2 === 0) {
                    const block = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.8, 0.8), matConcrete);
                    block.position.set(halfW + 0.5, 2.4 + r * 0.8, -1.2 + c * 0.8);
                    block.castShadow = true; block.receiveShadow = true;
                    visualGroups.hall.add(block);
                }
            }
        }

        // 奥の壁（正面の巨大な開口部）
        const opW = CONFIG.backOpening.width;
        const sideWallW = (CONFIG.room.width - opW) / 2;
        
        const backWallLeft = new THREE.Mesh(new THREE.BoxGeometry(sideWallW, h, 1), matConcrete);
        backWallLeft.position.set(-halfW + sideWallW / 2, h / 2, -halfD - 0.5);
        backWallLeft.castShadow = true; backWallLeft.receiveShadow = true;
        visualGroups.hall.add(backWallLeft);
        
        const backWallRight = new THREE.Mesh(new THREE.BoxGeometry(sideWallW, h, 1), matConcrete);
        backWallRight.position.set(halfW - sideWallW / 2, h / 2, -halfD - 0.5);
        backWallRight.castShadow = true; backWallRight.receiveShadow = true;
        visualGroups.hall.add(backWallRight);
        
        const topOpH = h - CONFIG.backOpening.height;
        const backWallTop = new THREE.Mesh(new THREE.BoxGeometry(opW, topOpH, 1), matConcrete);
        backWallTop.position.set(0, h - topOpH / 2, -halfD - 0.5);
        backWallTop.castShadow = true; backWallTop.receiveShadow = true;
        visualGroups.hall.add(backWallTop);

        // 手前の壁 (プレイヤーの背後)
        const frontWall = new THREE.Mesh(new THREE.BoxGeometry(CONFIG.room.width, h, 1), matConcrete);
        frontWall.position.set(0, h / 2, halfD + 0.5);
        frontWall.castShadow = true; frontWall.receiveShadow = true;
        visualGroups.hall.add(frontWall);

        // 柱の反復配置 (奥行きに合わせて自動配置)
        const pillarSpacing = 4;
        const pillarCount = Math.floor(CONFIG.room.depth / pillarSpacing) + 1;
        const startZ = -((pillarCount - 1) * pillarSpacing) / 2;

        for (let i = 0; i < pillarCount; i++) {
            const zPos = startZ + i * pillarSpacing;
            
            // 左側の柱
            const pLeft = new THREE.Mesh(new THREE.BoxGeometry(0.8, h, 1.2), matConcrete);
            pLeft.position.set(-halfW + 0.5, h / 2, zPos);
            pLeft.castShadow = true; pLeft.receiveShadow = true;
            visualGroups.hall.add(pLeft);

            // 右側の柱 (窓の中央 Z=0 付近と被る場合は生成しない)
            if (Math.abs(zPos) > 1.6) {
                const pRight = new THREE.Mesh(new THREE.BoxGeometry(0.8, h, 1.2), matConcrete);
                pRight.position.set(halfW - 0.5, h / 2, zPos);
                pRight.castShadow = true; pRight.receiveShadow = true;
                visualGroups.hall.add(pRight);
            }
        }

        // 机
        anchors.DESK_ORIGIN.position.set(0, 0, CONFIG.positions.deskZ);
        scene.add(anchors.DESK_ORIGIN);
        
        const deskTop = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.1, 0.8), matDarkMetal);
        deskTop.position.set(0, 0.85, 0);
        deskTop.castShadow = true; deskTop.receiveShadow = true;
        visualGroups.desk.add(deskTop);

        const deskLeg1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8, 0.6), matDarkMetal);
        deskLeg1.position.set(-0.7, 0.4, 0);
        deskLeg1.castShadow = true; deskLeg1.receiveShadow = true;
        visualGroups.desk.add(deskLeg1);

        const deskLeg2 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8, 0.6), matDarkMetal);
        deskLeg2.position.set(0.7, 0.4, 0);
        deskLeg2.castShadow = true; deskLeg2.receiveShadow = true;
        visualGroups.desk.add(deskLeg2);

        anchors.DESK_ORIGIN.add(visualGroups.desk);

        // ボタン (訓練開始用)
        anchors.BUTTON_ORIGIN.position.set(0, 0.9, CONFIG.positions.deskZ); // 机の上
        scene.add(anchors.BUTTON_ORIGIN);

        const buttonBase = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.18, 0.05, 16), matDarkMetal);
        buttonBase.position.set(0, 0.025, 0);
        buttonBase.castShadow = true; buttonBase.receiveShadow = true;
        visualGroups.button.add(buttonBase);

        const buttonPush = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.04, 16), matButton);
        buttonPush.position.set(0, 0.06, 0);
        buttonPush.castShadow = true; buttonPush.receiveShadow = true;
        visualGroups.button.add(buttonPush);

        anchors.BUTTON_ORIGIN.add(visualGroups.button);

        // 標的エリアのアンカー設定 (空間の広さに応じて相対配置)
        anchors.TARGET_AREA_ORIGIN.position.set(0, 0, -CONFIG.room.depth / 4);
        scene.add(anchors.TARGET_AREA_ORIGIN);

        // ---------------------------------------------------------
        // 再利用可能なホログラム標的
        // ---------------------------------------------------------
        function addHologramSegment(parent, x1, y1, x2, y2, thickness, material) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const length = Math.hypot(dx, dy);
            const segment = new THREE.Mesh(
                new THREE.BoxGeometry(length, thickness, thickness),
                material
            );
            segment.position.set((x1 + x2) / 2, (y1 + y2) / 2, 0);
            segment.rotation.z = Math.atan2(dy, dx);
            parent.add(segment);
            return segment;
        }

        function createHologramTarget() {
            const target = new THREE.Group();
            target.name = 'HOLOGRAM_TARGET';
            target.userData.isHologramTarget = true;

            const visual = new THREE.Group();
            visual.name = 'VISUAL';
            target.add(visual);

            const hologramMaterial = new THREE.MeshBasicMaterial({
                color: 0x35d9ff,
                transparent: true,
                opacity: 0.48,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                side: THREE.DoubleSide
            });
            const brightMaterial = new THREE.MeshBasicMaterial({
                color: 0xa8f5ff,
                transparent: true,
                opacity: 0.92,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                side: THREE.DoubleSide
            });

            const headOutline = new THREE.Mesh(
                new THREE.RingGeometry(0.22, 0.28, 24),
                hologramMaterial
            );
            headOutline.position.set(0, 0.72, 0);
            visual.add(headOutline);

            // 胴体、肩、腕、腰を低ポリゴンの細い直方体で表現する。
            addHologramSegment(visual, -0.43, 0.30, 0.43, 0.30, 0.055, hologramMaterial);
            addHologramSegment(visual, -0.43, 0.30, -0.56, -0.20, 0.055, hologramMaterial);
            addHologramSegment(visual, 0.43, 0.30, 0.56, -0.20, 0.055, hologramMaterial);
            addHologramSegment(visual, -0.43, 0.30, -0.31, -0.58, 0.055, hologramMaterial);
            addHologramSegment(visual, 0.43, 0.30, 0.31, -0.58, 0.055, hologramMaterial);
            addHologramSegment(visual, -0.31, -0.58, 0.31, -0.58, 0.055, hologramMaterial);

            // わずかな走査線で、ライトを使わず発光するホログラム感を補う。
            for (const y of [0.08, -0.18, -0.42]) {
                const scanLine = new THREE.Mesh(
                    new THREE.BoxGeometry(0.70 - Math.abs(y) * 0.25, 0.018, 0.025),
                    hologramMaterial
                );
                scanLine.position.set(0, y, 0.015);
                visual.add(scanLine);
            }

            const headSweetSpot = new THREE.Mesh(
                new THREE.RingGeometry(0.075, 0.115, 20),
                brightMaterial
            );
            headSweetSpot.name = 'HEAD_SWEET_SPOT';
            headSweetSpot.position.set(0, 0.72, 0.035);
            headSweetSpot.userData.hitZone = 'head';
            visual.add(headSweetSpot);

            const heartSweetSpot = new THREE.Mesh(
                new THREE.RingGeometry(0.07, 0.115, 20),
                brightMaterial
            );
            heartSweetSpot.name = 'HEART_SWEET_SPOT';
            heartSweetSpot.position.set(-0.14, 0.08, 0.04);
            heartSweetSpot.userData.hitZone = 'heart';
            visual.add(heartSweetSpot);

            // Materialだけを不可視にし、将来のRaycasterがMeshを識別できるようにする。
            const hitboxMaterial = new THREE.MeshBasicMaterial({ visible: false });
            const bodyHitbox = new THREE.Mesh(
                new THREE.BoxGeometry(0.92, 1.0, 0.28),
                hitboxMaterial
            );
            bodyHitbox.name = 'BODY_HITBOX';
            bodyHitbox.position.set(0, -0.12, 0);
            bodyHitbox.userData.hitZone = 'body';
            bodyHitbox.userData.isTargetHitbox = true;
            target.add(bodyHitbox);

            const headHitbox = new THREE.Mesh(
                new THREE.SphereGeometry(0.29, 12, 8),
                hitboxMaterial
            );
            headHitbox.name = 'HEAD_HITBOX';
            headHitbox.position.set(0, 0.72, 0);
            headHitbox.userData.hitZone = 'head';
            headHitbox.userData.isTargetHitbox = true;
            target.add(headHitbox);

            const heartHitbox = new THREE.Mesh(
                new THREE.SphereGeometry(0.15, 10, 6),
                hitboxMaterial
            );
            heartHitbox.name = 'HEART_HITBOX';
            heartHitbox.position.set(-0.14, 0.08, 0.02);
            heartHitbox.userData.hitZone = 'heart';
            heartHitbox.userData.isTargetHitbox = true;
            target.add(heartHitbox);

            target.userData.hitboxes = [bodyHitbox, headHitbox, heartHitbox];
            target.visible = false;
            return target;
        }

        const hologramTarget = createHologramTarget();
        anchors.TARGET_AREA_ORIGIN.add(hologramTarget);

        // 音声は一度だけロードし、各出現時に同じPositionalAudioを再利用する。
        const audioListener = new THREE.AudioListener();
        camera.add(audioListener);
        const targetSpawnAudio = new THREE.PositionalAudio(audioListener);
        targetSpawnAudio.setRefDistance(CONFIG.targetSequence.audioRefDistance);
        targetSpawnAudio.setMaxDistance(CONFIG.targetSequence.audioMaxDistance);
        targetSpawnAudio.setRolloffFactor(CONFIG.targetSequence.audioRolloffFactor);
        hologramTarget.add(targetSpawnAudio);

        let isTargetSpawnAudioReady = false;
        new THREE.AudioLoader().load(
            `./assets/audio/${CONFIG.targetSequence.audioFile}`,
            (buffer) => {
                targetSpawnAudio.setBuffer(buffer);
                targetSpawnAudio.setLoop(false);
                isTargetSpawnAudioReady = true;
            },
            undefined,
            (error) => {
                console.warn(`Target spawn audio could not be loaded: ${CONFIG.targetSequence.audioFile}`, error);
            }
        );

        function getTargetSpawnBounds() {
            const targetConfig = CONFIG.targetSequence;
            const bounds = {
                minX: -CONFIG.room.width / 2 + targetConfig.sideMargin,
                maxX: CONFIG.room.width / 2 - targetConfig.sideMargin,
                minY: targetConfig.minY,
                maxY: CONFIG.room.height - targetConfig.ceilingMargin,
                minZ: -CONFIG.room.depth / 2 + targetConfig.backMargin,
                maxZ: CONFIG.positions.deskZ - targetConfig.frontMarginFromDesk
            };

            // 極端に小さい設定でもNaNや逆転範囲を作らず、部屋中央へ退避する。
            for (const axis of ['X', 'Y', 'Z']) {
                const minKey = `min${axis}`;
                const maxKey = `max${axis}`;
                if (bounds[minKey] > bounds[maxKey]) {
                    const center = (bounds[minKey] + bounds[maxKey]) / 2;
                    bounds[minKey] = center;
                    bounds[maxKey] = center;
                }
            }
            return bounds;
        }

        function randomBetween(min, max) {
            return min + Math.random() * (max - min);
        }

        function randomDuration(min, max) {
            return randomBetween(Math.min(min, max), Math.max(min, max));
        }

        const targetSpawnBounds = getTargetSpawnBounds();
        if (CONFIG.debug.showTargetSpawnBounds) {
            const boundsWidth = Math.max(0.001, targetSpawnBounds.maxX - targetSpawnBounds.minX);
            const boundsHeight = Math.max(0.001, targetSpawnBounds.maxY - targetSpawnBounds.minY);
            const boundsDepth = Math.max(0.001, targetSpawnBounds.maxZ - targetSpawnBounds.minZ);
            const boundsDebug = new THREE.Mesh(
                new THREE.BoxGeometry(boundsWidth, boundsHeight, boundsDepth),
                new THREE.MeshBasicMaterial({
                    color: 0x35d9ff,
                    transparent: true,
                    opacity: 0.18,
                    wireframe: true
                })
            );
            boundsDebug.name = 'TARGET_SPAWN_BOUNDS_DEBUG';
            boundsDebug.position.set(
                (targetSpawnBounds.minX + targetSpawnBounds.maxX) / 2,
                (targetSpawnBounds.minY + targetSpawnBounds.maxY) / 2,
                (targetSpawnBounds.minZ + targetSpawnBounds.maxZ) / 2
            );
            anchors.HALL_ORIGIN.add(boundsDebug);
        }

        const targetSequenceState = {
            state: 'idle',
            remaining: 0,
            shownCount: 0,
            previousPosition: null
        };

        function chooseTargetPosition() {
            const bounds = getTargetSpawnBounds();
            const targetConfig = CONFIG.targetSequence;
            let candidate = new THREE.Vector3();

            for (let attempt = 0; attempt < targetConfig.maxPositionAttempts; attempt++) {
                candidate.set(
                    randomBetween(bounds.minX, bounds.maxX),
                    randomBetween(bounds.minY, bounds.maxY),
                    randomBetween(bounds.minZ, bounds.maxZ)
                );
                if (!targetSequenceState.previousPosition ||
                    candidate.distanceTo(targetSequenceState.previousPosition) >= targetConfig.minDistanceFromPrevious) {
                    break;
                }
            }
            return candidate;
        }

        function playTargetSpawnSound() {
            if (!isTargetSpawnAudioReady) return;
            try {
                if (audioListener.context.state === 'suspended') {
                    audioListener.context.resume().catch((error) => {
                        console.warn('Target spawn audio context could not be resumed.', error);
                    });
                }
                if (targetSpawnAudio.isPlaying) targetSpawnAudio.stop();
                targetSpawnAudio.play();
            } catch (error) {
                console.warn('Target spawn audio could not be played.', error);
            }
        }

        function showNextTarget() {
            const hallPosition = chooseTargetPosition();
            targetSequenceState.previousPosition = hallPosition.clone();

            // CONFIGで定義したホール座標を、標的アンカーのローカル座標へ変換する。
            anchors.HALL_ORIGIN.updateWorldMatrix(true, false);
            anchors.TARGET_AREA_ORIGIN.updateWorldMatrix(true, false);
            const worldPosition = anchors.HALL_ORIGIN.localToWorld(hallPosition.clone());
            hologramTarget.position.copy(anchors.TARGET_AREA_ORIGIN.worldToLocal(worldPosition));

            // 出現時のプレイヤー位置を向く。Pitch/Rollは常に0のままにする。
            const playerWorldPosition = new THREE.Vector3();
            camera.getWorldPosition(playerWorldPosition);
            const playerLocalPosition = anchors.TARGET_AREA_ORIGIN.worldToLocal(playerWorldPosition);
            const yaw = Math.atan2(
                playerLocalPosition.x - hologramTarget.position.x,
                playerLocalPosition.z - hologramTarget.position.z
            );
            hologramTarget.rotation.set(0, yaw, 0);
            hologramTarget.visible = true;

            targetSequenceState.shownCount += 1;
            targetSequenceState.state = 'visible';
            targetSequenceState.remaining = randomDuration(
                CONFIG.targetSequence.visibleDurationMin,
                CONFIG.targetSequence.visibleDurationMax
            );
            playTargetSpawnSound();
        }

        function completeTargetSequence() {
            hologramTarget.visible = false;
            targetSequenceState.state = 'complete';
            targetSequenceState.remaining = 0;
            console.log('Target sequence complete');
        }

        function startTargetSequence() {
            if (targetSequenceState.state !== 'idle') return false;
            hologramTarget.visible = false;
            targetSequenceState.state = 'waiting';
            targetSequenceState.remaining = CONFIG.targetSequence.initialDelay;
            targetSequenceState.shownCount = 0;
            targetSequenceState.previousPosition = null;
            return true;
        }

        function updateTargetSequence(dt) {
            if (targetSequenceState.state === 'idle') return;
            if (targetSequenceState.state === 'complete') {
                targetSequenceState.state = 'idle';
                return;
            }

            targetSequenceState.remaining -= dt;
            if (targetSequenceState.remaining > 0) return;

            if (targetSequenceState.state === 'waiting') {
                showNextTarget();
            } else if (targetSequenceState.state === 'visible') {
                hologramTarget.visible = false;
                if (targetSequenceState.shownCount >= CONFIG.targetSequence.count) {
                    completeTargetSequence();
                } else {
                    targetSequenceState.state = 'waiting';
                    targetSequenceState.remaining = randomDuration(
                        CONFIG.targetSequence.gapDurationMin,
                        CONFIG.targetSequence.gapDurationMax
                    );
                }
            }
        }

        // ---------------------------------------------------------
        // WebXRコントローラによるボタンへの直接接触
        // ---------------------------------------------------------
        const controllerContactGeometry = new THREE.SphereGeometry(
            CONFIG.interaction.controllerContactRadius,
            10,
            6
        );
        const controllerContactMaterial = new THREE.MeshBasicMaterial({
            color: 0x70eaff,
            transparent: true,
            opacity: 0.38,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const controllers = [renderer.xr.getController(0), renderer.xr.getController(1)];
        controllers.forEach((controller, index) => {
            controller.name = `XR_CONTROLLER_${index}`;
            controller.userData.isConnected = false;
            controller.userData.isTouchingButton = false;

            const contactPoint = new THREE.Mesh(controllerContactGeometry, controllerContactMaterial);
            contactPoint.name = 'BUTTON_CONTACT_POINT';
            contactPoint.position.z = CONFIG.interaction.controllerContactOffsetZ;
            contactPoint.visible = false;
            controller.add(contactPoint);

            controller.addEventListener('connected', () => {
                controller.userData.isConnected = true;
                contactPoint.visible = true;
            });
            controller.addEventListener('disconnected', () => {
                controller.userData.isConnected = false;
                controller.userData.isTouchingButton = false;
                contactPoint.visible = false;
            });
            anchors.PLAYER_START.add(controller);
        });

        const buttonPushRestY = buttonPush.position.y;
        const buttonSurfaceY = buttonPushRestY + 0.02;
        const controllerContactWorldPosition = new THREE.Vector3();
        const controllerContactButtonPosition = new THREE.Vector3();

        function updateButtonInteraction(dt) {
            let isAnyControllerTouching = false;
            anchors.BUTTON_ORIGIN.updateWorldMatrix(true, false);

            for (const controller of controllers) {
                if (!controller.userData.isConnected) continue;

                controllerContactWorldPosition.set(0, 0, CONFIG.interaction.controllerContactOffsetZ);
                controller.localToWorld(controllerContactWorldPosition);
                controllerContactButtonPosition.copy(controllerContactWorldPosition);
                anchors.BUTTON_ORIGIN.worldToLocal(controllerContactButtonPosition);

                const radialDistance = Math.hypot(
                    controllerContactButtonPosition.x,
                    controllerContactButtonPosition.z
                );
                const isTouching =
                    radialDistance <= CONFIG.interaction.buttonTouchRadius + CONFIG.interaction.controllerContactRadius &&
                    Math.abs(controllerContactButtonPosition.y - buttonSurfaceY) <=
                        CONFIG.interaction.buttonTouchHeight + CONFIG.interaction.controllerContactRadius;

                if (isTouching && !controller.userData.isTouchingButton) {
                    startTargetSequence();
                }
                controller.userData.isTouchingButton = isTouching;
                isAnyControllerTouching = isAnyControllerTouching || isTouching;
            }

            const targetButtonY = isAnyControllerTouching
                ? buttonPushRestY - CONFIG.interaction.buttonDepression
                : buttonPushRestY;
            const blend = Math.min(1, CONFIG.interaction.buttonAnimationSpeed * dt);
            buttonPush.position.y += (targetButtonY - buttonPush.position.y) * blend;
        }

        // PCブラウザ確認用のマウスクリック＆ドラッグによる見回し機能
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        // カメラの回転角度を保持
        let cameraRotation = { x: 0, y: 0 };

        document.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.offsetX, y: e.offsetY };
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaMove = {
                    x: e.offsetX - previousMousePosition.x,
                    y: e.offsetY - previousMousePosition.y
                };

                // マウス移動量に応じて回転角度を更新
                cameraRotation.y -= deltaMove.x * 0.005; // 左右
                cameraRotation.x -= deltaMove.y * 0.005; // 上下

                // 上下の回転を制限（真上・真下を向きすぎないように）
                cameraRotation.x = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, cameraRotation.x));

                // カメラのクォータニオンを更新
                const quaternionX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), cameraRotation.x);
                const quaternionY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), cameraRotation.y);
                
                // Y軸回転を先に適用し、その後にX軸回転を適用
                camera.quaternion.copy(quaternionY).multiply(quaternionX);

                previousMousePosition = { x: e.offsetX, y: e.offsetY };
            }
        });

        document.addEventListener('mouseup', () => { isDragging = false; });
        document.addEventListener('mouseleave', () => { isDragging = false; });

        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        const clock = new THREE.Clock();

        renderer.setAnimationLoop(function () {
            const dt = clock.getDelta();

            // WebXRのコントローラスティック移動（ロコモーション）処理
            if (renderer.xr.isPresenting) {
                const session = renderer.xr.getSession();
                if (session && session.inputSources) {
                    for (const source of session.inputSources) {
                        // gamepadプロパティを持つコントローラのみ処理
                        if (source.gamepad && source.gamepad.axes.length >= 4) {
                            // Quest等の標準: axes[2]がスティックのX軸, axes[3]がY軸
                            const xAxis = source.gamepad.axes[2];
                            const yAxis = source.gamepad.axes[3];

                            // デッドゾーンの設定（スティックのわずかな傾きや遊びを無視）
                            if (Math.abs(xAxis) > 0.1 || Math.abs(yAxis) > 0.1) {
                                const speed = 3.0 * dt; // 移動速度 (秒速3メートル)

                                // ヘッドセット(カメラ)が向いている水平方向を計算
                                const cameraDir = new THREE.Vector3();
                                camera.getWorldDirection(cameraDir);
                                cameraDir.y = 0; // 上下方向の浮遊を無効化（常に床を這う）
                                cameraDir.normalize();

                                // ヘッドセットの右方向ベクトルを計算
                                const cameraRight = new THREE.Vector3();
                                cameraRight.crossVectors(cameraDir, new THREE.Vector3(0, 1, 0)).normalize();

                                // スティックの入力値から移動ベクトルを合成
                                // ※Y軸は前に倒すと負(-1)になる仕様のため、反転させる
                                const moveVec = new THREE.Vector3();
                                moveVec.addScaledVector(cameraDir, -yAxis * speed);
                                moveVec.addScaledVector(cameraRight, xAxis * speed);

                                // プレイヤーの空間全体（Rig）を移動
                                anchors.PLAYER_START.position.add(moveVec);
                            }
                        }
                    }
                }
            }

            updateButtonInteraction(dt);
            updateTargetSequence(dt);
            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
