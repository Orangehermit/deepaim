<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spaceship Workshop (WebXR)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: #555;
            font-family: sans-serif;
            pointer-events: none;
            z-index: 100;
        }
    </style>
    <!-- Import Maps for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">Spaceship Workshop - VR Ready</div>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ==========================================
        // 1. Scene & XR Setup
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        // 微細なフォグで空間の奥行きを演出
        scene.fog = new THREE.FogExp2(0x050505, 0.05);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.xr.enabled = true;
        // SRGBカラースペースを適用（色の正確な表現のため）
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        document.body.appendChild(VRButton.createButton(renderer));

        // ==========================================
        // 2. Anchors (構造とアンカー)
        // ==========================================
        const anchors = {
            PLAYER_START: new THREE.Object3D(),
            WORKBENCH_ORIGIN: new THREE.Object3D(),
            WORKBENCH_SURFACE: new THREE.Object3D(),
            MAIN_LIGHT_ORIGIN: new THREE.Object3D(),
            MAIN_LIGHT_TARGET: new THREE.Object3D(),
            DOOR_ORIGIN: new THREE.Object3D(),
            DOOR_SIGN_ANCHOR: new THREE.Object3D(),
            PASSAGE_ORIGIN: new THREE.Object3D(),
            PASSAGE_SIGN_ANCHOR: new THREE.Object3D(),
            
            WORKBENCH_VISUAL: new THREE.Group(),
            LIGHT_FIXTURE_VISUAL: new THREE.Group(),
            DOOR_VISUAL: new THREE.Group(),
            PASSAGE_VISUAL: new THREE.Group()
        };

        // アンカーのWorld座標設定 (ルートレベルのアンカー)
        anchors.PLAYER_START.position.set(0, 0, 3.5);
        anchors.WORKBENCH_ORIGIN.position.set(0, 0, 0); 
        anchors.MAIN_LIGHT_ORIGIN.position.set(0, 2.9, 0);
        anchors.DOOR_ORIGIN.position.set(0, 0, -5);
        anchors.PASSAGE_ORIGIN.position.set(-5, 0, 0);

        // 子アンカーのLocal座標設定
        anchors.WORKBENCH_SURFACE.position.set(0, 0.8, 0); // WORKBENCH_ORIGIN基準
        anchors.MAIN_LIGHT_TARGET.position.set(0, 0.8, 0); // WORKBENCH_ORIGIN基準
        anchors.DOOR_SIGN_ANCHOR.position.set(0, 2.2, 0.05); // DOOR_ORIGIN基準 (Z:-4.95 -> 0.05)
        anchors.PASSAGE_SIGN_ANCHOR.position.set(0.05, 2.2, 0); // PASSAGE_ORIGIN基準 (X:-4.95 -> 0.05)

        // 親子関係の構築 (Scene Graph)
        // 1. Scene直下のルートアンカー
        scene.add(anchors.PLAYER_START);
        scene.add(anchors.WORKBENCH_ORIGIN);
        scene.add(anchors.MAIN_LIGHT_ORIGIN);
        scene.add(anchors.DOOR_ORIGIN);
        scene.add(anchors.PASSAGE_ORIGIN);

        // 2. WORKBENCH階層
        anchors.WORKBENCH_ORIGIN.add(anchors.WORKBENCH_VISUAL);
        anchors.WORKBENCH_ORIGIN.add(anchors.WORKBENCH_SURFACE);
        anchors.WORKBENCH_ORIGIN.add(anchors.MAIN_LIGHT_TARGET);

        // 3. MAIN_LIGHT階層 (SpotLight自身は後ほどここに追加される)
        anchors.MAIN_LIGHT_ORIGIN.add(anchors.LIGHT_FIXTURE_VISUAL);

        // 4. DOOR階層
        anchors.DOOR_ORIGIN.add(anchors.DOOR_VISUAL);
        anchors.DOOR_ORIGIN.add(anchors.DOOR_SIGN_ANCHOR);

        // 5. PASSAGE階層
        anchors.PASSAGE_ORIGIN.add(anchors.PASSAGE_VISUAL);
        anchors.PASSAGE_ORIGIN.add(anchors.PASSAGE_SIGN_ANCHOR);


        // カメラ（プレイヤー）のセットアップ
        anchors.PLAYER_START.add(camera);
        // 非VR時（PC等のプレビュー用）の視点高さ (1.65m)
        camera.position.set(0, 1.65, 0);

        // PCブラウザ等で視点移動できるようにOrbitControlsを追加
        const controls = new OrbitControls(camera, renderer.domElement);
        // カメラは PLAYER_START (Z=3.5) の子要素として配置されているため、相対的に奥のワークベンチ方向を見るようにターゲットを設定
        controls.target.set(0, 1.65, -3.5);
        controls.update();

        // ==========================================
        // 3. Room / Environment (部屋の構造)
        // ==========================================
        const roomGroup = new THREE.Group();
        scene.add(roomGroup);

        const wallMat = new THREE.MeshStandardMaterial({ 
            color: 0x1a1a1a, 
            roughness: 0.8, 
            metalness: 0.3 
        });
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0x222222, 
            roughness: 0.4, 
            metalness: 0.6 
        });

        // 天井と床 (10m x 10m)
        const floor = new THREE.Mesh(new THREE.BoxGeometry(10, 0.1, 10), floorMat);
        floor.position.set(0, -0.05, 0);
        floor.receiveShadow = true;
        roomGroup.add(floor);

        const ceiling = new THREE.Mesh(new THREE.BoxGeometry(10, 0.1, 10), wallMat);
        ceiling.position.set(0, 3.05, 0);
        ceiling.receiveShadow = true;
        roomGroup.add(ceiling);

        // 手前の壁 (Z=5)
        const wallFront = new THREE.Mesh(new THREE.BoxGeometry(10, 3, 0.1), wallMat);
        wallFront.position.set(0, 1.5, 5.05);
        wallFront.receiveShadow = true;
        roomGroup.add(wallFront);

        // 奥の壁 (Z=-5) - 扉がある壁
        const wallBack = new THREE.Mesh(new THREE.BoxGeometry(10, 3, 0.1), wallMat);
        wallBack.position.set(0, 1.5, -5.05);
        wallBack.receiveShadow = true;
        roomGroup.add(wallBack);

        // 左の壁 (X=-5) - 通路の開口部 (幅1m, 高さ2m) を空けるため複数のBoxで構築
        const wallLeftFront = new THREE.Mesh(new THREE.BoxGeometry(0.1, 3, 4.5), wallMat);
        wallLeftFront.position.set(-5.05, 1.5, 2.75);
        wallLeftFront.receiveShadow = true;
        roomGroup.add(wallLeftFront);

        const wallLeftBack = new THREE.Mesh(new THREE.BoxGeometry(0.1, 3, 4.5), wallMat);
        wallLeftBack.position.set(-5.05, 1.5, -2.75);
        wallLeftBack.receiveShadow = true;
        roomGroup.add(wallLeftBack);

        const wallLeftTop = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1, 1), wallMat);
        wallLeftTop.position.set(-5.05, 2.5, 0);
        wallLeftTop.receiveShadow = true;
        roomGroup.add(wallLeftTop);

        // 右の壁 (X=5) - 船窓の開口部 (幅3m, 高さ1m, 床から1m)
        const wallRightZ1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 3, 3.5), wallMat);
        wallRightZ1.position.set(5.05, 1.5, 3.25);
        wallRightZ1.receiveShadow = true;
        roomGroup.add(wallRightZ1);

        const wallRightZ2 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 3, 3.5), wallMat);
        wallRightZ2.position.set(5.05, 1.5, -3.25);
        wallRightZ2.receiveShadow = true;
        roomGroup.add(wallRightZ2);

        const wallRightBottom = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1, 3), wallMat);
        wallRightBottom.position.set(5.05, 0.5, 0);
        wallRightBottom.receiveShadow = true;
        roomGroup.add(wallRightBottom);

        const wallRightTop = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1, 3), wallMat);
        wallRightTop.position.set(5.05, 2.5, 0);
        wallRightTop.receiveShadow = true;
        roomGroup.add(wallRightTop);

        // --- 突き出し式の出窓（Bay Window）構造（カプセル型に丸め、さらに10cm突出して35cmへ変更） ---
        const bayWindowGroup = new THREE.Group();
        bayWindowGroup.position.set(5.0, 1.5, 0); // 壁面を基準に配置
        roomGroup.add(bayWindowGroup);

        const radius = 0.35; // 突出量および角の丸みの半径 (さらに10cm拡張して 35cm)
        const windowWidth = 3.0;
        const windowHeight = 1.0;
        const flatWidth = windowWidth - (radius * 2); // 直線部分の幅 (2.3)
        const zOffset = flatWidth / 2; // カーブの中心のZ座標 (1.15)

        // 出窓用のガラス（少し透過度を上げて外の星を見やすく調整）
        const glassMat = new THREE.MeshPhysicalMaterial({
            color: 0x88bbff,
            metalness: 0.1,
            roughness: 0.05,
            transparent: true,
            opacity: 0.25,
            transmission: 0.4,
            side: THREE.DoubleSide, // カーブを描くため両面描画
            depthWrite: false
        });

        // 1. 正面の平らなガラス
        const frontGlass = new THREE.Mesh(new THREE.PlaneGeometry(flatWidth, windowHeight), glassMat);
        frontGlass.rotation.y = -Math.PI / 2; // 部屋の方向(-X)を向くように
        frontGlass.position.set(radius, 0, 0);
        
        // 2. 左のカーブガラス (+Z側)
        const leftCurveGlass = new THREE.Mesh(
            new THREE.CylinderGeometry(radius, radius, windowHeight, 16, 1, true, 0, Math.PI / 2),
            glassMat
        );
        leftCurveGlass.position.set(0, 0, zOffset);

        // 3. 右のカーブガラス (-Z側)
        const rightCurveGlass = new THREE.Mesh(
            new THREE.CylinderGeometry(radius, radius, windowHeight, 16, 1, true, Math.PI / 2, Math.PI / 2),
            glassMat
        );
        rightCurveGlass.position.set(0, 0, -zOffset);

        bayWindowGroup.add(frontGlass, leftCurveGlass, rightCurveGlass);

        // 上下フレームのマテリアルと生成
        const frameMat = new THREE.MeshStandardMaterial({ color: 0x22262a, roughness: 0.4, metalness: 0.7 });
        const frameHeight = 0.08;
        const topY = windowHeight / 2 + frameHeight / 2;
        const bottomY = -(windowHeight / 2 + frameHeight / 2);

        const createCapsuleFrame = (yPos) => {
            const frameGroup = new THREE.Group();
            
            // 正面直線部 (幅 flatWidth、奥行き radius)
            const frontFrame = new THREE.Mesh(new THREE.BoxGeometry(radius, frameHeight, flatWidth), frameMat);
            frontFrame.position.set(radius / 2, yPos, 0);
            
            // 左カーブ部 (扇型のソリッド)
            const leftFrame = new THREE.Mesh(
                new THREE.CylinderGeometry(radius, radius, frameHeight, 16, 1, false, 0, Math.PI / 2),
                frameMat
            );
            leftFrame.position.set(0, yPos, zOffset);

            // 右カーブ部
            const rightFrame = new THREE.Mesh(
                new THREE.CylinderGeometry(radius, radius, frameHeight, 16, 1, false, Math.PI / 2, Math.PI / 2),
                frameMat
            );
            rightFrame.position.set(0, yPos, -zOffset);

            frameGroup.add(frontFrame, leftFrame, rightFrame);
            return frameGroup;
        };

        bayWindowGroup.add(createCapsuleFrame(topY));
        bayWindowGroup.add(createCapsuleFrame(bottomY));

        // 窓の輪郭フレーム（発光アクセント）
        const windowFrameMat = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0x005588, emissiveIntensity: 2.0 });
        const glowThickness = 0.02;
        const glowOffset = radius + 0.005; // ガラス表面よりわずかに外側に配置

        const createGlowLine = (yPos) => {
            const glowGroup = new THREE.Group();
            
            // 正面直線部
            const frontGlow = new THREE.Mesh(new THREE.BoxGeometry(glowThickness, glowThickness, flatWidth), windowFrameMat);
            frontGlow.position.set(glowOffset, yPos, 0);
            
            // 左カーブ部
            const leftGlow = new THREE.Mesh(
                new THREE.CylinderGeometry(glowOffset, glowOffset, glowThickness, 16, 1, true, 0, Math.PI / 2),
                windowFrameMat
            );
            leftGlow.position.set(0, yPos, zOffset);

            // 右カーブ部
            const rightGlow = new THREE.Mesh(
                new THREE.CylinderGeometry(glowOffset, glowOffset, glowThickness, 16, 1, true, Math.PI / 2, Math.PI / 2),
                windowFrameMat
            );
            rightGlow.position.set(0, yPos, -zOffset);

            glowGroup.add(frontGlow, leftGlow, rightGlow);
            return glowGroup;
        };

        bayWindowGroup.add(createGlowLine(windowHeight / 2));
        bayWindowGroup.add(createGlowLine(-windowHeight / 2));

        // 船窓の外（宇宙空間と星）
        const spaceGroup = new THREE.Group();
        scene.add(spaceGroup);
        // 背景となる暗黒の平面
        const spaceBg = new THREE.Mesh(new THREE.PlaneGeometry(40, 20), new THREE.MeshBasicMaterial({ color: 0x000000 }));
        spaceBg.position.set(15, 1.5, 0);
        spaceBg.rotation.y = -Math.PI / 2;
        spaceGroup.add(spaceBg);
        
        // 星のパーティクル
        const starGeom = new THREE.BufferGeometry();
        const starCount = 800;
        const starPositions = new Float32Array(starCount * 3);
        for(let i=0; i<starCount; i++) {
            starPositions[i*3] = 5.8 + Math.random() * 15;     // X: 窓の外すぐ近くから遠くまで
            starPositions[i*3+1] = (Math.random() - 0.5) * 25; // Y: 高さ
            starPositions[i*3+2] = (Math.random() - 0.5) * 35; // Z: 幅
        }
        starGeom.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMat = new THREE.PointsMaterial({ 
            color: 0xffffff, 
            size: 0.08, 
            transparent: true, 
            opacity: 0.9,
            depthWrite: false 
        });
        const stars = new THREE.Points(starGeom, starMat);
        spaceGroup.add(stars);


        // ==========================================
        // 4. Workbench & Props
        // ==========================================
        const benchMat = new THREE.MeshStandardMaterial({ color: 0x2c3035, roughness: 0.7, metalness: 0.5 });
        const benchMesh = new THREE.Mesh(new THREE.BoxGeometry(2, 0.8, 1), benchMat);
        benchMesh.position.set(0, 0.4, 0); // 中心を底面から持ち上げる
        benchMesh.castShadow = true;
        benchMesh.receiveShadow = true;
        anchors.WORKBENCH_VISUAL.add(benchMesh);

        // ワークベンチの小物たち (WORKBENCH_SURFACEを基準に配置)
        
        // 1. 量子コア (回転アニメーション用)
        const quantumGroup = new THREE.Group();
        quantumGroup.position.set(0, 0, -0.25); // ワークベンチの少し奥側にずらす
        quantumGroup.scale.set(0.85, 0.85, 0.85); // 浮遊オブジェクト全体を85%のサイズに縮小
        anchors.WORKBENCH_SURFACE.add(quantumGroup);

        const coreGeometry = new THREE.IcosahedronGeometry(0.12, 0);
        const coreMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x00ffff, emissive: 0x0088aa, emissiveIntensity: 0.8, wireframe: true 
        });
        const quantumCore = new THREE.Mesh(coreGeometry, coreMaterial);
        quantumCore.position.set(0, 0.25, 0); // 天板から少し浮かす
        quantumCore.castShadow = true;
        quantumGroup.add(quantumCore);

        // --- 量子コアの白いドーナツ型土台 ---
        const coreBaseGeometry = new THREE.TorusGeometry(0.16, 0.025, 16, 32);
        const coreBaseMaterial = new THREE.MeshStandardMaterial({
            color: 0xeeeeee, // 白
            roughness: 0.4,
            metalness: 0.6,
        });
        const quantumCoreBase = new THREE.Mesh(coreBaseGeometry, coreBaseMaterial);
        quantumCoreBase.position.set(0, 0.025, 0); // 天板の上に配置
        quantumCoreBase.rotation.x = -Math.PI / 2; // 平らに寝かせる
        quantumCoreBase.castShadow = true;
        quantumCoreBase.receiveShadow = true;
        quantumGroup.add(quantumCoreBase);

        // 2. 通信ラジオ
        const radioGroup = new THREE.Group();
        const radioBody = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.2), new THREE.MeshStandardMaterial({ color: 0x111111 }));
        radioBody.position.set(0, 0.075, 0);
        radioBody.castShadow = true;
        const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.25), new THREE.MeshStandardMaterial({ color: 0x888888 }));
        antenna.position.set(0.1, 0.2, -0.05);
        radioGroup.add(radioBody);
        radioGroup.add(antenna);
        radioGroup.position.set(-0.6, 0, -0.2);
        anchors.WORKBENCH_SURFACE.add(radioGroup);

        // 3. 未来的3Dプリンター
        const printerGroup = new THREE.Group();
        const pMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.2, roughness: 0.8 });
        const pBase = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 0.4), pMat);
        pBase.position.set(0, 0.025, 0);
        pBase.castShadow = true;
        const pBack = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.05), pMat);
        pBack.position.set(0, 0.2, -0.175);
        pBack.castShadow = true;
        const pTop = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 0.4), pMat);
        pTop.position.set(0, 0.4, 0);
        pTop.castShadow = true;
        
        // プリント中の物体
        const printingObj = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.1), new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xaa5500 }));
        printingObj.position.set(0, 0.1, 0);

        printerGroup.add(pBase, pBack, pTop, printingObj);
        printerGroup.position.set(0.6, 0, 0);
        anchors.WORKBENCH_SURFACE.add(printerGroup);


        // ==========================================
        // 5. Lighting (最重要要素)
        // ==========================================
        // 環境光: 暗め
        const ambientLight = new THREE.AmbientLight(0x222233, 0.2);
        scene.add(ambientLight);

        // メイン照明 (スポットライト)
        const mainLight = new THREE.SpotLight(0xfff0dd, 25.0);
        mainLight.angle = Math.PI / 7; // 比較的狭いスポット
        mainLight.penumbra = 0.5; // エッジのボケ
        mainLight.decay = 1.8;
        mainLight.distance = 10;
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        mainLight.shadow.bias = -0.001;
        
        anchors.MAIN_LIGHT_ORIGIN.add(mainLight);
        mainLight.target = anchors.MAIN_LIGHT_TARGET;

        // 照明器具の見た目
        const fixtureMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.2), new THREE.MeshStandardMaterial({ color: 0x111111 }));
        anchors.LIGHT_FIXTURE_VISUAL.add(fixtureMesh);

        // 床面補助光 (埋め込み式床面蛍光灯)
        const createFloorLight = (x, z, colorHex) => {
            const lGroup = new THREE.Group();
            
            // 見た目の発光ストリップ
            const strip = new THREE.Mesh(
                new THREE.BoxGeometry(1.2, 0.02, 0.1),
                new THREE.MeshStandardMaterial({ color: 0x000000, emissive: colorHex, emissiveIntensity: 2.0 })
            );
            strip.position.set(0, 0.01, 0);
            
            // 実際のPointLight (弱め・広がりを持たせる)
            const pLight = new THREE.PointLight(colorHex, 2.0, 5);
            pLight.position.set(0, 0.2, 0);
            
            lGroup.add(strip);
            lGroup.add(pLight);
            lGroup.position.set(x, 0, z);
            return lGroup;
        };

        // 4箇所に配置（シアンとアンバーを交互に）
        scene.add(createFloorLight(2.5, 2.5, 0x00ffff));  // Cyan
        scene.add(createFloorLight(-2.5, -2.5, 0x00ffff)); // Cyan
        scene.add(createFloorLight(-2.5, 2.5, 0xffa000));  // Amber
        scene.add(createFloorLight(2.5, -2.5, 0xffa000));  // Amber

        // 微細な浮遊ダスト (スポットライトの中)
        const dustCount = 30;
        const dustGeom = new THREE.BufferGeometry();
        const dustPos = new Float32Array(dustCount * 3);
        const dustVel = [];
        for(let i=0; i<dustCount; i++) {
            dustPos[i*3] = (Math.random() - 0.5) * 1.2;     // X幅
            dustPos[i*3+1] = 0.8 + Math.random() * 2.1;     // Y高さ (机から天井まで)
            dustPos[i*3+2] = (Math.random() - 0.5) * 1.2;   // Z奥行き
            
            dustVel.push({
                y: - (0.002 + Math.random() * 0.005),
                x: (Math.random() - 0.5) * 0.002,
                z: (Math.random() - 0.5) * 0.002
            });
        }
        dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
        const dustMat = new THREE.PointsMaterial({
            color: 0xdddddd,
            size: 0.015,
            transparent: true,
            opacity: 0.4,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const dustParticles = new THREE.Points(dustGeom, dustMat);
        scene.add(dustParticles);


        // ==========================================
        // 6. Portals & Signs (扉と通路・行き先表示)
        // ==========================================
        
        // --- 奥の大きな扉 (W2m x H2m) ---
        const doorFrameMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8, roughness: 0.4 });
        const doorPanelMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.6, roughness: 0.6 });
        
        const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 0.05), doorPanelMat);
        doorMesh.position.set(0, 1, 0.025); // Z軸を少し前に出して壁に被せる
        doorMesh.castShadow = true;
        anchors.DOOR_VISUAL.add(doorMesh);
        
        const doorFrame = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.1, 0.1), doorFrameMat);
        doorFrame.position.set(0, 1.05, 0.0);
        anchors.DOOR_VISUAL.add(doorFrame);

        // 扉の輪郭を発光させる (シアン)
        const doorGlowMat = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0x00ffff, emissiveIntensity: 2.0 });
        const doorGlowThickness = 0.04;
        const doorGlowDepth = 0.06;
        
        // 扉の周囲 (上、左、右) に発光ラインを配置
        const doorTopGlow = new THREE.Mesh(new THREE.BoxGeometry(2.0 + doorGlowThickness * 2, doorGlowThickness, doorGlowDepth), doorGlowMat);
        doorTopGlow.position.set(0, 2.0 + doorGlowThickness / 2, 0.05);
        
        const doorLeftGlow = new THREE.Mesh(new THREE.BoxGeometry(doorGlowThickness, 2.0, doorGlowDepth), doorGlowMat);
        doorLeftGlow.position.set(-1.0 - doorGlowThickness / 2, 1.0, 0.05);
        
        const doorRightGlow = new THREE.Mesh(new THREE.BoxGeometry(doorGlowThickness, 2.0, doorGlowDepth), doorGlowMat);
        doorRightGlow.position.set(1.0 + doorGlowThickness / 2, 1.0, 0.05);

        // 実際のPointLightは削除し、emissiveによる自己発光のみとする
        anchors.DOOR_VISUAL.add(doorTopGlow, doorLeftGlow, doorRightGlow);

        // --- 左の通路と階段 ---
        const passageGroup = new THREE.Group();
        
        // 通路の床と天井 (奥へ2m)
        const pFloor = new THREE.Mesh(new THREE.BoxGeometry(2, 0.1, 1), floorMat);
        pFloor.position.set(-1, -0.05, 0);
        const pCeiling = new THREE.Mesh(new THREE.BoxGeometry(2, 0.1, 1), wallMat);
        pCeiling.position.set(-1, 2.05, 0);
        
        // 通路の側面壁
        const pWallBack = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 0.1), wallMat);
        pWallBack.position.set(-1, 1, -0.55);
        const pWallFront = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 0.1), wallMat);
        pWallFront.position.set(-1, 1, 0.55);
        
        passageGroup.add(pFloor, pCeiling, pWallBack, pWallFront);

        // 先が見えないようにする階段 (上に上がる)
        for(let i=0; i<5; i++) {
            const step = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.2, 1), floorMat);
            step.position.set(-2.125 - i*0.25, 0.1 + i*0.2, 0);
            passageGroup.add(step);
        }
        // 階段の奥を塞ぐ壁
        const blockWall = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2, 1), wallMat);
        blockWall.position.set(-3.2, 1.5, 0);
        passageGroup.add(blockWall);

        // 通路の天井ライトを追加
        const passageLightGroup = new THREE.Group();
        
        // 円筒形のライト本体 (見た目)
        const passageLightMesh = new THREE.Mesh(
            new THREE.CylinderGeometry(0.1, 0.1, 0.05),
            new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xffddaa, emissiveIntensity: 2.0 }) // 暖かみのある色
        );
        
        // 実際の光源を追加して通路を照らす
        const passagePointLight = new THREE.PointLight(0xffddaa, 1.5, 4.0);
        passagePointLight.position.set(0, -0.1, 0); // ライト本体の少し下に配置
        
        passageLightGroup.add(passageLightMesh);
        passageLightGroup.add(passagePointLight);
        
        // 通路の中央、天井直下に配置
        passageLightGroup.position.set(-1.0, 2.0, 0);
        passageGroup.add(passageLightGroup);

        anchors.PASSAGE_VISUAL.add(passageGroup);


        // --- 行き先表示プレート生成関数 ---
        function createSignMesh(text, w, h) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            // 背景
            ctx.fillStyle = '#151515';
            ctx.fillRect(0, 0, 512, 256);
            // 枠線
            ctx.strokeStyle = '#00aaaa';
            ctx.lineWidth = 12;
            ctx.strokeRect(6, 6, 500, 244);
            // テキスト
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 54px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 256, 128);

            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            const mat = new THREE.MeshBasicMaterial({ map: texture });
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
            return mesh;
        }

        // ドア用サイン (奥の壁なのでZ軸を向く)
        const doorSign = createSignMesh("Training Room", 0.3, 0.15);
        anchors.DOOR_SIGN_ANCHOR.add(doorSign);

        // 通路用サイン (左の壁なのでX軸を向くようY軸回転)
        const passageSign = createSignMesh("Break Room", 0.3, 0.15);
        passageSign.rotation.y = Math.PI / 2;
        anchors.PASSAGE_SIGN_ANCHOR.add(passageSign);


        // ==========================================
        // 7. Window Resize & Render Loop
        // ==========================================
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        const clock = new THREE.Clock();

        function animate() {
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // OrbitControlsの更新
            controls.update();

            // 量子コアの浮遊と回転
            quantumCore.rotation.y += delta;
            quantumCore.rotation.x += delta * 0.5;
            quantumCore.position.y = 0.25 + Math.sin(time * 2) * 0.02;

            // スポットライトのダストのアニメーション
            const positions = dustParticles.geometry.attributes.position.array;
            for(let i=0; i<dustCount; i++) {
                positions[i*3] += dustVel[i].x;     // X
                positions[i*3+1] += dustVel[i].y;   // Y
                positions[i*3+2] += dustVel[i].z;   // Z

                // 床付近まで落ちたら天井へリセット
                if(positions[i*3+1] < 0.8) {
                    positions[i*3+1] = 2.9;
                    positions[i*3] = (Math.random() - 0.5) * 1.2;
                    positions[i*3+2] = (Math.random() - 0.5) * 1.2;
                }
            }
            dustParticles.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        renderer.setAnimationLoop(animate);
    </script>
</body>
</html>
